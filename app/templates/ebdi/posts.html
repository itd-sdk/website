{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/ebdi/style.css">
<link rel="stylesheet" href="/static/css/ebdi/feed.css">
<script src="/static/js/ebdi/feed.js" data-kind="posts"></script>
<meta name="description" content="Единая База Данных ИТД: лента постов, самые популярные посты по лайкам, репостам, комментариям и просмотрам">
{% endblock %}

{% block content %}
<div id="landing">
    <img id="banner" src="/static/images/ebdi.png">
    <div id="landing-description">Единая База Данных ИТД</div>
</div>

<div id="content">
    <div id="feedback">
        <img src="/static/icons/vote.svg">
        <div id="feedback-content">
            <div id="feedback-title">Обратная связь</div>
            <div id="feedback-description">Предложите идеи для ЕБДИ или сообщите о баге.</div>
        </div>
        <button onclick="location.href='https://github.com/itd-sdk/website/issues/new'">Перейти <img src="/static/icons/arrow.svg"></button>
    </div>
    <nav id="tabs">
        <a href="/ebdi/users" class="tab">Пользователи</a>
        <a href="/ebdi/clans" class="tab">Кланы</a>
        <a href="/ebdi/posts" class="tab tab-active">Посты</a>
        <a href="/ebdi/comments" class="tab">Комментарии</a>
        <a href="/ebdi/stats" class="tab">Статистика</a>
    </nav>

    <h2>Посты ИТД</h2>

    <div id="total-objects" hidden>Всего в базе данных <span id="total-objects-value">0</span> постов</div>

    <div id="feed-controls">
        <div id="feed-controls-row">
            <label id="sort-label">Сортировка
                <select id="sort-select">
                    <option value="created">Дата создания</option>
                    <option value="found">Дата добавления в ЕБДИ</option>
                    <option value="likes">Количество лайков</option>
                    <option value="comments">Количество комментариев</option>
                    <option value="reposts">Количество репостов</option>
                    <option value="views">Количество просмотров</option>
                </select>
            </label>
            <div class="feed-toggles">
                <label class="feed-toggle"><input type="checkbox" data-state="deleted"><span>Показывать удалённые</span></label>
            </div>
        </div>
        <div class="feed-search-box" id="user-search-box">
            <input id="user-input" class="feed-search" type="search" placeholder="Поиск по пользователю" autocomplete="off">
            <button class="feed-search-clear" type="button" title="Очистить" aria-label="Очистить" hidden></button>
            <div id="user-candidates" class="feed-candidates" hidden></div>
        </div>
        <div class="feed-search-box">
            <input id="query-input" class="feed-search" type="search" placeholder="Поиск по содержанию" autocomplete="off">
            <button class="feed-search-clear" type="button" title="Очистить" aria-label="Очистить" hidden></button>
        </div>
    </div>

    <div id="feed"></div>
    <div id="list-empty" hidden>Ничего не найдено</div>
    <div id="list-error" hidden>
        <div id="error-text"></div>
        <button id="retry-button">Попробовать снова</button>
    </div>
    <div class="row" id="list-loader" hidden>
        <div class="loader-spinner"></div>
    </div>
    <div id="sentinel-bottom" class="sentinel"></div>
</div>
{% endblock %}
